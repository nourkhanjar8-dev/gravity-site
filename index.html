@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#070707;--surface:#121010;--text:#fcfcfc;--muted:#a49c98;--line:#2a2422;--rt:#e0583f}}
:root[data-theme="dark"]{--bg:#070707;--surface:#121010;--text:#fcfcfc;--muted:#a49c98;--line:#2a2422;--rt:#e0583f}
html{scroll-behavior:smooth;scroll-padding-top:calc(env(safe-area-inset-top,0px) + 76px)}
*{box-sizing:border-box;margin:0}
body{background:var(--bg);color:var(--text);font-family:'Tajawal','Inter',system-ui,sans-serif;line-height:1.7;overflow-x:hidden}
html[lang=en] body{font-family:'Inter','Tajawal',system-ui,sans-serif}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:60;background:var(--ink)}
a{color:inherit;text-decoration:none}
.wrap{max-width:1120px;margin:auto;padding:0 22px;position:relative}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:50;background:#070707e6;backdrop-filter:blur(10px);border-bottom:1px solid #ffffff14;color:var(--paper)}
nav{display:flex;align-items:center;justify-content:space-between;height:68px;gap:14px}
.logo{display:flex;align-items:center;gap:10px;font-family:'Inter',sans-serif;font-weight:800;font-size:23px;letter-spacing:.14em}
.logo svg{width:34px;height:34px;fill:var(--paper)}
.links{display:flex;gap:24px;color:var(--pm);font-size:15px}.links a:hover{color:#fff}
.tools{display:flex;gap:8px;align-items:center}
.btn{display:inline-block;background:var(--rust);color:#fff;padding:12px 26px;border-radius:999px;font:inherit;font-weight:700;border:1px solid var(--rust);cursor:pointer;transition:.25s}
.btn:hover{background:var(--deep);border-color:var(--deep)}
.btn.ghost{background:none;border-color:#ffffff40;padding:8px 16px;font-size:14px;color:var(--paper)}
.btn.ghost:hover{border-color:#fff;background:none}
.hero{position:relative;background:radial-gradient(700px 500px at 50% 42%,#511e1566,transparent 70%),var(--ink);color:var(--paper);min-height:calc(100svh - 68px);display:grid;place-items:center;text-align:center;overflow:hidden;padding:70px 0 50px}
#cv{position:absolute;inset:0;width:100%;height:100%}
.core{position:relative;width:150px;height:150px;margin:0 auto 34px;display:grid;place-items:center}
.core svg{width:76px;height:76px;fill:var(--paper);filter:drop-shadow(0 0 24px #9c3523);animation:pulse 4s ease-in-out infinite}
.o{position:absolute;border:1px solid #fcfcfc30;border-radius:50%;animation:spin linear infinite}
.o::after{content:"";position:absolute;top:-4px;left:50%;width:8px;height:8px;border-radius:50%;background:var(--rt);box-shadow:0 0 14px var(--rt)}
.o1{inset:0;animation-duration:9s}.o2{inset:-26px;animation-duration:15s;animation-direction:reverse}.o3{inset:-54px;animation-duration:24s}
.o2::after{background:var(--paper);box-shadow:0 0 12px #fff}
@keyframes spin{to{transform:rotate(360deg)}}@keyframes pulse{50%{transform:scale(1.08)}}
.tag{display:inline-block;border:1px solid #fcfcfc2e;border-radius:999px;padding:4px 18px;font-size:14px;color:var(--pm);margin-bottom:20px}
h1{font-size:clamp(34px,6.4vw,68px);line-height:1.22;font-weight:800;max-width:900px;margin:0 auto}
h1 em{font-style:normal;color:var(--rt)}
.hero p{color:var(--pm);font-size:19px;max-width:620px;margin:20px auto 32px}
.cta{display:flex;gap:12px;flex-wrap:wrap;justify-content:center}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:18px;margin:56px auto 0;max-width:860px;border-top:1px solid #fcfcfc1c;padding-top:30px}
.stats b{display:block;font-size:38px;font-weight:800;font-family:'Inter',sans-serif}.stats span{color:var(--pm);font-size:14.5px}
.scroll{position:absolute;bottom:14px;left:50%;width:1px;height:38px;background:linear-gradient(var(--rt),transparent);animation:fall 2s ease-in infinite}
@keyframes fall{0%{transform:translateY(-12px);opacity:0}40%{opacity:1}100%{transform:translateY(8px);opacity:0}}
section{padding:92px 0}
.eyebrow{color:var(--rt);font-weight:700;font-size:15px;margin-bottom:8px;letter-spacing:.04em}
h2{font-size:clamp(28px,4vw,44px);line-height:1.3;font-weight:800;margin-bottom:14px}
.lead{color:var(--muted);max-width:640px;font-size:18px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:18px;margin-top:44px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:28px;transition:transform .3s,border-color .3s}
.card:hover{border-color:var(--rust)}
.ic{width:50px;height:50px;border-radius:50%;display:grid;place-items:center;font-size:22px;background:var(--ink);margin-bottom:16px;box-shadow:inset 0 0 0 1px #9c3523}
.card h3{font-size:20px;margin-bottom:6px}.card p{color:var(--muted);font-size:15.5px}
.steps{counter-reset:s}.steps .card::before{counter-increment:s;content:"0" counter(s);display:block;font-weight:800;font-size:36px;color:var(--rt);margin-bottom:4px;font-family:'Inter',sans-serif}
.alt{background:var(--surface);border-block:1px solid var(--line)}.alt .card{background:var(--bg)}
.work .card{min-height:230px;display:flex;flex-direction:column;justify-content:flex-end;color:#fff;border:0;background:radial-gradient(circle at 80% 15%,#9c3523 0 22%,transparent 23%),#070707;overflow:hidden}
.work .card:nth-child(2){background:radial-gradient(circle at 20% 15%,#fcfcfc22 0 30%,transparent 31%),#511e15}
.work .card:nth-child(3){background:radial-gradient(circle at 50% 0,#9c3523 0 35%,transparent 36%),#121010}
.work .card p{color:#ffffffbb}.work .card:hover{transform:translateY(8px)}
.contact{display:grid;grid-template-columns:1fr 1fr;gap:44px;align-items:start}
form{display:grid;gap:12px}
input,select,textarea{width:100%;padding:14px 16px;border-radius:14px;border:1px solid var(--line);background:var(--surface);color:var(--text);font:inherit}
input:focus,select:focus,textarea:focus{outline:2px solid var(--rust);outline-offset:1px}
textarea{min-height:120px;resize:vertical}
.info p{margin:10px 0;color:var(--muted)}.info b{color:var(--text)}
#msg{color:var(--rt);font-weight:700;min-height:24px}
footer{background:var(--ink);color:var(--pm);padding:44px 0 34px;font-size:14px}
footer img{width:150px;display:block;margin-bottom:18px}
footer .wrap{display:flex;justify-content:space-between;align-items:flex-end;flex-wrap:wrap;gap:12px}
.rv{opacity:0;transform:translateY(-46px)}
.rv.in{opacity:1;transform:none;transition:opacity .5s,transform .9s cubic-bezier(.34,1.5,.64,1) var(--d,0s)}
@media (prefers-reduced-motion:reduce){.rv{opacity:1;transform:none}.o,.core svg,.scroll{animation:none}}
@media (max-width:820px){.links{display:none}.contact{grid-template-columns:1fr}section{padding:62px 0}.hero{padding:50px 0 44px}}
.lg{display:block;background:var(--logo) center/contain no-repeat}
nav{height:78px!important}.logo .lg{width:100px;height:65px}
.core{width:190px!important;height:190px!important}.core svg{width:84px;height:92px}
.o2{inset:-26px!important}.o3{inset:-54px!important}
.stats b{font-size:21px!important;font-family:inherit!important}.stats div{border-inline-start:2px solid var(--rust);padding-inline-start:14px;text-align:start}
.offer{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:18px;margin-top:44px}
.of{position:relative;border-radius:24px;padding:34px;background:radial-gradient(circle at 90% 0,#9c3523 0 28%,transparent 29%),#070707;color:#fcfcfc;overflow:hidden;min-height:250px}
.of:nth-child(2){background:radial-gradient(circle at 10% 0,#511e15 0 30%,transparent 31%),#121010}
.of .bd{display:inline-block;border:1px solid #fcfcfc55;border-radius:999px;padding:2px 14px;font-size:13px;margin-bottom:46px;color:#fcfcfc}
.of h3{font-size:26px;margin-bottom:8px}.of p{color:#d8d1cd;font-size:16px}
.octa{margin-top:30px}
.clients{background:#fcfcfc;border-radius:26px;padding:26px;display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-top:40px}
.clients div{height:104px;display:grid;place-items:center;padding:10px}
.clients img{max-width:100%;max-height:78px;object-fit:contain;filter:grayscale(1);opacity:.78;transition:.3s}
.clients div:hover img{filter:none;opacity:1}
.wa{position:fixed;bottom:calc(env(safe-area-inset-bottom,0px) + 18px);inset-inline-start:18px;z-index:40;background:#25d366;color:#fff;width:54px;height:54px;border-radius:50%;display:grid;place-items:center;box-shadow:0 6px 20px #0006}
.wa svg{width:28px;height:28px;fill:#fff}
.info a{color:var(--rt);font-weight:600}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}img{max-width:100%}
/* refinements: smaller type, smaller center g, tablet + mobile */
h1{font-size:clamp(27px,5vw,52px)}h2{font-size:clamp(23px,3.3vw,35px)}
.hero p{font-size:17px}.lead{font-size:16.5px}.tag{font-size:13px}.eyebrow{font-size:14px}
.links{font-size:14px}.card h3{font-size:18px}.card p{font-size:14.5px}.steps .card::before{font-size:30px}
.of h3{font-size:22px}.of p{font-size:15px}.stats b{font-size:17px!important}.stats span{font-size:13.5px}
section{padding:76px 0}.btn{min-height:44px;display:inline-flex;align-items:center;justify-content:center}
.core{width:170px!important;height:170px!important}.core svg{width:50px;height:55px}
.o2{inset:-24px!important}.o3{inset:-48px!important}
@media (min-width:700px) and (max-width:900px){.links{display:flex;gap:16px;font-size:13.5px}.hero{min-height:auto;padding:70px 0 60px}}
@media (max-width:560px){nav{height:64px!important;gap:8px}.logo .lg{width:72px;height:47px}.btn{padding:8px 16px;font-size:13.5px;min-height:40px}.btn.ghost{padding:4px 12px;font-size:12.5px}
.hero{min-height:auto;padding:34px 0 60px}.core{width:120px!important;height:120px!important;margin-bottom:34px}.core svg{width:36px;height:40px}.o2{inset:-16px!important}.o3{inset:-32px!important}
h1{font-size:27px}.hero p{font-size:15.5px;margin:16px auto 24px}.cta .btn{width:100%}.stats{margin-top:34px;gap:14px}
section{padding:54px 0}.grid,.offer{margin-top:30px;grid-template-columns:1fr}.card{padding:22px}.of{padding:24px;min-height:0}.of .bd{margin-bottom:22px}
.clients{grid-template-columns:repeat(2,1fr);padding:12px;border-radius:20px}.clients div{height:88px}.wa{width:48px;height:48px}.wa svg{width:25px;height:25px}
footer .wrap{flex-direction:column;align-items:flex-start}.wrap{padding:0 18px}}
</style>
</head>
